# Builds the installers on real Windows, macOS and Linux machines and publishes a GitHub release.
# Start it by pushing a version tag that matches app/package.json, e.g.:
#   git tag v0.5.0 && git push origin v0.5.0
# Scriptorium checks this repository's latest release when it starts and offers the update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:      # "Run workflow" button: builds everything as a test, without publishing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: --win }
          - { name: macos, os: macos-latest, args: --mac }
          - { name: linux, os: ubuntu-latest, args: --linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # the program compares its own version with the release tag; they must match or it would offer the same update forever
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "app/package.json says $v but the tag is $GITHUB_REF_NAME"; exit 1; fi

      - name: rpmbuild (for the Fedora package)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npm run songs:stamp
      - run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # not signed with a certificate (macOS gets an ad-hoc signature)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      # the program checks every download against these before installing it
      - name: Checksums
        run: |
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then notes="$RUNNER_TEMP/notes.md"; echo "Scriptorium ${GITHUB_REF_NAME#v}" > "$notes"; fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Scriptorium ${GITHUB_REF_NAME#v}" --notes-file "$notes"
